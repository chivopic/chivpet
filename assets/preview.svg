<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
  </defs>

  <style>
    .term-bg { fill: #11111b; }
    .term-window { fill: #1e1e2e; stroke: #313244; stroke-width: 1; }
    .term-header { fill: url(#headerGrad); }
    .term-title { fill: #a6adc8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
    .code { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", Menlo, monospace; font-size: 13.5px; }
    .dim { fill: #6c7086; }
    .white { fill: #cdd6f4; }
    .green { fill: #a6e3a1; }
    .blue { fill: #89b4fa; }
    .yellow { fill: #f9e2af; }
    .peach { fill: #fab387; }
    .mauve { fill: #cba6f7; }
    .red { fill: #f38ba8; }
    .card-bg { fill: #181825; stroke: #313244; stroke-width: 1; rx: 8px; }
    .badge { font-family: "JetBrains Mono", monospace; font-size: 11.5px; font-weight: 600; }
  </style>

  <!-- Terminal Window with Shadow -->
  <rect x="20" y="20" width="840" height="520" rx="12" class="term-window" filter="url(#shadow)" />

  <!-- Window Header -->
  <path d="M 20 32 Q 20 20 32 20 L 848 20 Q 860 20 860 32 L 860 56 L 20 56 Z" class="term-header" />
  <line x1="20" y1="56" x2="860" y2="56" stroke="#313244" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="44" cy="38" r="6.5" fill="#f38ba8" />
  <circle cx="64" cy="38" r="6.5" fill="#f9e2af" />
  <circle cx="84" cy="38" r="6.5" fill="#a6e3a1" />

  <!-- Window Title -->
  <text x="440" y="42" text-anchor="middle" class="term-title">Ghostty — chiv@omarchy: ~/Projects/chivpet</text>

  <!-- Terminal Body -->
  <!-- Prompt 1 -->
  <g transform="translate(50, 90)" class="code">
    <text y="0">
      <tspan class="blue" font-weight="bold">chiv</tspan>
      <tspan class="dim"> in </tspan>
      <tspan class="green">~/Projects/chivpet</tspan>
      <tspan class="dim"> on </tspan>
      <tspan class="mauve">main</tspan>
      <tspan class="yellow"> [!]</tspan>
    </text>
    <text y="24">
      <tspan class="peach" font-weight="bold">❯ </tspan>
      <tspan class="white">chivpet status</tspan>
    </text>
  </g>

  <!-- Pet Status Card (Left Main Output) -->
  <g transform="translate(50, 145)">
    <rect width="470" height="150" class="card-bg" />
    <g transform="translate(25, 25)" class="code">
      <!-- ASCII Art -->
      <text x="0" y="20" class="white" font-weight="bold">    /\_/\</text>
      <text x="0" y="42" class="white" font-weight="bold">   ( • . • )</text>
      <text x="0" y="64" class="white" font-weight="bold">   /       \   ~</text>
      <text x="0" y="86" class="white" font-weight="bold">  (   ( )   )</text>
      <text x="0" y="108" class="white" font-weight="bold">   (__) (__)</text>

      <!-- Details -->
      <text x="200" y="35" class="white" font-weight="bold">🐾 Chiv</text>
      <text x="265" y="35" class="green">· ●</text>
      <text x="200" y="65" class="dim">Chilling and ready to code.</text>
      <text x="200" y="95" class="dim">Lv.4 · 12 commands</text>
    </g>
  </g>

  <!-- Right Showcase Cards (Live Reactions) -->
  <g transform="translate(540, 145)">
    <!-- Card 1: git push -->
    <!-- Card 1: git push -->
    <rect y="0" width="280" height="64" class="card-bg" />
    <text x="14" y="26" class="code green" font-weight="bold"> /\_/\ ✨</text>
    <text x="14" y="46" class="code green" font-weight="bold">\(^.^)/🎉</text>
    <text x="95" y="26" class="code green" font-weight="bold">git push origin main</text>
    <text x="95" y="46" class="code dim" font-size="12">🎉 Cheering (+15 XP)</text>

    <!-- Card 2: cargo test failed -->
    <rect y="74" width="280" height="64" class="card-bg" />
    <text x="14" y="100" class="code red" font-weight="bold"> \___/ </text>
    <text x="14" y="120" class="code red" font-weight="bold">( T.T )💧</text>
    <text x="95" y="100" class="code red" font-weight="bold">cargo test (code 101)</text>
    <text x="95" y="120" class="code dim" font-size="12">😿 Frustrated (-4 Mood)</text>

    <!-- Card 3: bongo cat hacking -->
    <rect y="148" width="280" height="64" class="card-bg" />
    <text x="14" y="174" class="code peach" font-weight="bold"> /\_/\ 💻</text>
    <text x="14" y="194" class="code peach" font-weight="bold">(•̀ω•́)tap</text>
    <text x="95" y="174" class="code peach" font-weight="bold">Codex / Claude Hacking</text>
    <text x="95" y="194" class="code dim" font-size="12">💻 Bongo Cat Mode</text>
  </g>

  <!-- Prompt 2 (Bottom live interaction) -->
  <g transform="translate(50, 405)" class="code">
    <text y="0">
      <tspan class="peach" font-weight="bold">❯ </tspan>
      <tspan class="white">chivpet feed "salmon"</tspan>
    </text>
    <text y="25" class="green">Nom nom nom! Loved the salmon! (+25 Satiety, +10 XP)</text>

    <text y="58">
      <tspan class="peach" font-weight="bold">❯ </tspan>
      <tspan class="dim">git commit -m "feat: complete Phase 1" _</tspan>
    </text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(50, 498)">
    <rect x="0" y="0" width="105" height="22" rx="4" fill="#313244" />
    <text x="52" y="15" text-anchor="middle" class="badge green">● UDS Active</text>

    <rect x="115" y="0" width="125" height="22" rx="4" fill="#313244" />
    <text x="177" y="15" text-anchor="middle" class="badge blue">⚡ Shell Hook Ready</text>

    <rect x="250" y="0" width="135" height="22" rx="4" fill="#313244" />
    <text x="317" y="15" text-anchor="middle" class="badge mauve">🐱 State Saved</text>
  </g>
</svg>
